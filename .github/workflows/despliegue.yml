# KAN-11 · Despliegue continuo a producción (ADR-22).
#
# Cada merge a main despliega el backend en Elastic Beanstalk y el frontend en
# Firebase Hosting. También se puede lanzar a mano desde la pestaña Actions.
#
# Las pruebas ya corrieron en el CI del PR, que es obligatorio para unir a main;
# aquí solo se compila y se publica.
#
# Configuración (docs/despliegue/aplicacion.md), en el ambiente "produccion" de GitHub:
#   Variables: AWS_REGION, AWS_ROL_DESPLIEGUE, EB_APLICACION, EB_ENTORNO, EB_BUCKET,
#              API_URL, VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#              VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
#   Secreto:   FIREBASE_SERVICE_ACCOUNT_COCINA_SIN_ESTRES_585CE (lo crea firebase init hosting:github)
# En AWS no hay llaves guardadas: el job asume un rol con OIDC.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez, y uno en curso no se cancela a la mitad.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  backend:
    name: desplegar-backend
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar el jar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar en Elastic Beanstalk
        env:
          EB_APLICACION: ${{ vars.EB_APLICACION }}
          EB_ENTORNO: ${{ vars.EB_ENTORNO }}
          EB_BUCKET: ${{ vars.EB_BUCKET }}
          VERSION: v${{ github.run_number }}-${{ github.sha }}
        run: |
          VERSION="${VERSION:0:16}"
          export VERSION
          bash .github/scripts/desplegar-backend.sh

      - name: Prueba de humo
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$API_URL/salud"

  frontend:
    name: desplegar-frontend
    needs: backend
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Instalar dependencias
        working-directory: web-app
        run: npm ci

      - name: Compilar para producción
        working-directory: web-app
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_AUTH_MODO: firebase
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COCINA_SIN_ESTRES_585CE }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: web-app
