name: Incidente en producción
description: La app o una parte de ella dejó de funcionar para las usuarias.
title: "Incidente: "
labels: [incidente]
body:
  - type: markdown
    attributes:
      value: |
        Registro de incidentes (auditoría del 4 de noviembre). Al cerrarlo, copia el resumen a docs/operacion/incidentes.md.
  - type: input
    id: inicio
    attributes:
      label: Cuándo empezó
      placeholder: "2026-11-04 08:30 (hora de Colombia)"
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué vio la usuaria o la vigilancia, en qué pantalla o ruta de la API.
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options:
        - "Alto: nadie puede usar la app"
        - "Medio: una función no sirve"
        - "Bajo: molestia o dato equivocado sin pérdida"
    validations:
      required: true
  - type: textarea
    id: causa
    attributes:
      label: Causa
      description: Se puede completar después.
  - type: textarea
    id: solucion
    attributes:
      label: Solución y prevención
      description: Qué se hizo, con el KAN y el PR, y qué evita que se repita.
  - type: input
    id: fin
    attributes:
      label: Cuándo quedó resuelto
