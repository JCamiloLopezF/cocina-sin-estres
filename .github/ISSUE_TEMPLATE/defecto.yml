name: Defecto
description: Algo no funciona como dice el requisito o el caso de prueba.
title: "Defecto: "
labels: [defecto]
body:
  - type: input
    id: caso
    attributes:
      label: Caso de prueba o requisito
      placeholder: "CP-007 · RNF-05 · KAN-16"
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
      description: Con captura, código HTTP y el identificador del error si lo hay.
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - "Crítica: bloquea un proceso o pierde datos"
        - "Alta: falla una función sin alternativa"
        - "Media: hay alternativa"
        - "Baja: texto o detalle visual"
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente y versión
      placeholder: "Producción, release del 28 de octubre · Chrome en Android"
