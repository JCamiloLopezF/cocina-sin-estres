# Auditoría del 27 de octubre: un cuerpo de 2 MB devolvía 503 o dejaba la petición colgada
# más de 40 s, porque nginx lo aceptaba entero (hasta 1 MB por defecto lo pasaba a la API y
# más allá esperaba). Con este tope nginx responde 413 de inmediato, sin llegar a la API.
# La API además rechaza cuerpos de más de 64 KB (KAN-32); 128 KB deja margen a los encabezados.
client_max_body_size 128k;
