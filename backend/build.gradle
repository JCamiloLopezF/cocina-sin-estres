// Backend de Cocina sin estrés (KAN-8).
// Las versiones de las dependencias las fija el BOM de Spring Boot; aquí solo
// se escriben las que el BOM no gestiona (Firebase Admin SDK).
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'co.edu.uniquindio'
version = '0.1.0'
description = 'API REST de Cocina sin estrés'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    firebaseAdminVersion = '9.9.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Flyway es el único camino para cambiar el esquema (ADR-07).
    // En Spring Boot 4 la autoconfiguración de Flyway está en su propio starter:
    // con solo flyway-core las migraciones no se aplican y el arranque falla
    // después, al validar las entidades contra una base vacía.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // Verificación del token de Firebase en el backend (ADR-05, ADR-19).
    implementation "com.google.firebase:firebase-admin:${firebaseAdminVersion}"

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // En Spring Boot 4 el soporte de MockMvc salió del starter-test a su propio módulo.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // La prueba de integración levanta MySQL 8.4 en Docker para que Flyway
    // aplique V1 y Hibernate pueda validar las entidades contra el esquema real.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
